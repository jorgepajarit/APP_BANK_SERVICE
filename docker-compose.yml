version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: bank_postgres
    environment:
      POSTGRES_USER: bank_user
      POSTGRES_PASSWORD: bank_password
      POSTGRES_DB: bank_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bank_user -d bank_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  banco_fastapi:
    build:
      context: .
      dockerfile: App/fastapi_app/Dockerfile
    container_name: banco_fastapi
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://bank_user:bank_password@db:5432/bank_db
      SECRET_KEY: "change-me-in-production"
    depends_on:
      db:
        condition: service_healthy

  banco_flask:
    build:
      context: .
      dockerfile: App/flask_app/Dockerfile
    container_name: banco_flask
    ports:
      - "5000:5000"
    environment:
      API_BASE_URL: http://banco_fastapi:8000
      FLASK_SECRET_KEY: "another-secret-key"
    depends_on:
      - banco_fastapi
