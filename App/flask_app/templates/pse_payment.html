{% extends "base.html" %}

{% block title %}Pago PSE - BankService{% endblock %}

{% block content %}
<div class="header">
    <div>
        <h1>Pago PSE (Simulado)</h1>
        <p style="color: var(--text-secondary);">Simula un pago a través de la pasarela PSE</p>
    </div>
    <a href="{{ url_for('dashboard') }}" class="btn-primary" style="background: rgba(255,255,255,0.1); border: 1px solid var(--glass-border);">
        <i class="fas fa-arrow-left"></i> Volver
    </a>
</div>

<div class="login-wrapper" style="height: auto; align-items: flex-start; padding-top: 20px;">
    <div class="glass-container login-card" style="max-width: 500px;">
        <div style="text-align: center; margin-bottom: 20px;">
            <i class="fas fa-shopping-cart fa-2x" style="color: var(--accent-blue);"></i>
        </div>
        <form action="{{ url_for('pse_view') }}" method="POST">
            <div class="form-group">
                <label style="display: block; margin-bottom: 8px; font-size: 0.9rem;">Cuenta para Debitar</label>
                <select name="account_id" class="input-glass" required>
                    {% for account in accounts %}
                    <option value="{{ account.id }}">Cuenta #{{ account.id }} - Balance: ${{ account.balance }}</option>
                    {% endfor %}
                </select>
            </div>
            
            <div class="form-group">
                <label style="display: block; margin-bottom: 8px; font-size: 0.9rem;">Monto del Pago</label>
                <input type="number" step="0.01" name="amount" class="input-glass" placeholder="0.00" required>
            </div>
            
            <p style="font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 20px;">
                <i class="fas fa-info-circle"></i> Al confirmar, se simulará una respuesta positiva (APPROVED) desde el webhook de PSE.
            </p>
            
            <button type="submit" class="btn-primary" style="width: 100%; margin-top: 10px;">
                Pagar con PSE
            </button>
        </form>
    </div>
</div>
{% endblock %}
