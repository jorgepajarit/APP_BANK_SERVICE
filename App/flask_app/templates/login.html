{% extends "base.html" %}

{% block title %}Login - BankService{% endblock %}

{% block content %}
<div class="login-wrapper">
    <div class="glass-container login-card">
        <div style="text-align: center; margin-bottom: 30px;">
            <i class="fas fa-university fa-3x" style="color: var(--accent-blue); margin-bottom: 15px;"></i>
            <h2>Bienvenido</h2>
            <p style="color: var(--text-secondary);">Ingrese sus credenciales para continuar</p>
        </div>
        
        <form action="{{ url_for('login') }}" method="POST">
            <div class="form-group">
                <label style="display: block; margin-bottom: 8px; font-size: 0.9rem;">Usuario</label>
                <input type="text" name="username" class="input-glass" placeholder="Ej: jorgepajarit" required>
            </div>
            
            <div class="form-group">
                <label style="display: block; margin-bottom: 8px; font-size: 0.9rem;">Contraseña</label>
                <input type="password" name="password" class="input-glass" placeholder="••••••••" required>
            </div>
            
            <button type="submit" class="btn-primary" style="width: 100%; margin-top: 10px;">
                Iniciar Sesión
            </button>
        </form>
    </div>
</div>
{% endblock %}
