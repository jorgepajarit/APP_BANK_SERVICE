{% extends "base.html" %}

{% block title %}Transferir - BankService{% endblock %}

{% block content %}
<div class="header">
    <div>
        <h1>Transferencia Bancaria</h1>
        <p style="color: var(--text-secondary);">Envía dinero de forma segura</p>
    </div>
    <a href="{{ url_for('dashboard') }}" class="btn-primary" style="background: rgba(255,255,255,0.1); border: 1px solid var(--glass-border);">
        <i class="fas fa-arrow-left"></i> Volver
    </a>
</div>

<div class="login-wrapper" style="height: auto; align-items: flex-start; padding-top: 20px;">
    <div class="glass-container login-card" style="max-width: 500px;">
        <form action="{{ url_for('transfer_view') }}" method="POST">
            <div class="form-group">
                <label style="display: block; margin-bottom: 8px; font-size: 0.9rem;">Cuenta de Origen</label>
                <select name="source_id" class="input-glass" required>
                    {% for account in accounts %}
                    <option value="{{ account.id }}">Cuenta #{{ account.id }} - Balance: ${{ account.balance }}</option>
                    {% endfor %}
                </select>
            </div>
            
            <div class="form-group">
                <label style="display: block; margin-bottom: 8px; font-size: 0.9rem;">ID de Cuenta Destino</label>
                <input type="number" name="target_id" class="input-glass" placeholder="Ej: 2" required>
            </div>
            
            <div class="form-group">
                <label style="display: block; margin-bottom: 8px; font-size: 0.9rem;">Monto a Transferir</label>
                <input type="number" step="0.01" name="amount" class="input-glass" placeholder="0.00" required>
            </div>
            
            <button type="submit" class="btn-primary" style="width: 100%; margin-top: 10px;">
                Confirmar Transferencia
            </button>
        </form>
    </div>
</div>
{% endblock %}
